name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare desktop tools
        run: ./tools/prepare-youtube.ps1

      - name: Build frontend
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --config electron-builder.yml --publish never

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release view "v$version" --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @('--target', '${{ github.sha }}', '--title', "SPMusic $version", '--generate-notes', '--repo', '${{ github.repository }}')
            if ($version.Contains('-')) { $releaseArgs += '--prerelease' }
            gh release create "v$version" @releaseArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload installer and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $channel = if ($version -match '-(alpha|beta|rc)') { $Matches[1] } else { 'latest' }
          $metadata = "release/$channel.yml"
          if (-not (Test-Path $metadata)) {
            if (-not (Test-Path 'release/latest.yml')) { throw 'Không tìm thấy metadata cập nhật.' }
            Copy-Item 'release/latest.yml' $metadata
          }
          gh release upload "v$version" `
            "release/SPMusic-$version-x64.exe" `
            "release/SPMusic-$version-x64.exe.blockmap" `
            $metadata --clobber --repo "${{ github.repository }}"
