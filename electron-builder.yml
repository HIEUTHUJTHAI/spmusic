appId: com.spmusic.desktop
productName: SPMusic
directories:
  output: release
  buildResources: electron/resources
files:
  - electron/main.cjs
  - electron/preload.cjs
  - electron/rollback.cjs
  - electron/update-notice.cjs
  - server/src/**/*
  - server/package.json
  - client/dist/**/*
  - client/public/**/*
  - package.json
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'
  - '!node_modules/ffprobe-static/bin/win32/ia32/**'
asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**
  - node_modules/@electric-sql/pglite/**
extraResources:
  - from: tools/vendor/yt-dlp.exe
    to: tools/yt-dlp.exe
  - from: tools/vendor/node.exe
    to: tools/node.exe
win:
  icon: electron/resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
publish:
  provider: github
  owner: HIEUTHUJTHAI
  repo: spmusic
  releaseType: release
